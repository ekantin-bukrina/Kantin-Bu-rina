<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Warung Bu Rina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Tata letak: rail biru di kiri (bilah tab di bawah pada ponsel), pesanan sebagai panel kanan atau lembar bawah, keypad untuk uang bayar, mode layar TV untuk antrean. */
:root{
  --bg:#eef1fa; --surface:#ffffff; --fg:#0f1730; --muted:#566086; --line:#d8ddf0;
  --accent:#2447d6; --accent-fg:#ffffff; --accent-soft:#e1e7fc;
  --rail:#1c36b8; --rail-fg:#ffffff;
  --sun:#ffd23f; --sun-fg:#2a2200;
  --c-makanan:#ff8a3d; --c-minuman:#12a8bd; --c-lainnya:#8a78f0;
  --good:#16794a; --bad:#b3261e;
  --display:'Sora','Trebuchet MS',system-ui,sans-serif;
  --text:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1022; --surface:#141b38; --fg:#e8ecfb; --muted:#9aa5cc; --line:#27315c;
  --accent:#8aa2ff; --accent-fg:#0a1235; --accent-soft:#1c2650; --rail:#101a4a; --good:#5fd09a; --bad:#ff8b80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1022; --surface:#141b38; --fg:#e8ecfb; --muted:#9aa5cc; --line:#27315c;
  --accent:#8aa2ff; --accent-fg:#0a1235; --accent-soft:#1c2650; --rail:#101a4a; --good:#5fd09a; --bad:#ff8b80; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--text)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);position:sticky;top:0;align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:22px 14px 18px max(16px,env(safe-area-inset-left,0px))}
.brand b{display:block;font:700 24px/1.1 var(--display);letter-spacing:-.02em}
.brand span{display:block;font-size:12px;opacity:.75;margin-top:4px}
.links{display:flex;flex-direction:column;gap:4px;margin-top:28px}
.links a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;opacity:.8}
.links a[aria-current="page"]{background:rgba(255,255,255,.16);opacity:1;font-weight:700}
.links svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.date{margin-top:auto;font-size:12px;opacity:.75}
.content{min-width:0;padding:24px max(24px,env(safe-area-inset-right,0px)) 48px 24px}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 26px/1.1 var(--display);letter-spacing:-.02em;margin:0}
h2{font:700 17px/1.2 var(--display);margin:0}
h3{font:700 12px/1 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=search],input:not([type]),select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
button{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:42px}
button:disabled{opacity:.4;cursor:not-allowed}
.btn{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.wide{width:100%;min-height:50px;margin-top:12px;font-size:16px}
.danger{color:var(--bad);border-color:var(--bad)}
/* kasir */
.kasir{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.menu-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools input{flex:1 1 180px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border-radius:999px;min-height:38px;padding:4px 14px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{--cat:var(--c-lainnya);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:96px;padding:12px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--cat) 45%,var(--line));background:color-mix(in srgb,var(--cat) 15%,var(--surface))}
.tile.makanan{--cat:var(--c-makanan)}.tile.minuman{--cat:var(--c-minuman)}
.tile b{font-weight:600;line-height:1.25}
.tile span{font-weight:700}
.tile small{color:var(--muted);font-weight:500}
.tile:hover:not(:disabled){border-color:var(--cat);transform:translateY(-1px)}
.tile:active:not(:disabled){transform:scale(.98)}
.cart{position:sticky;top:20px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head button{display:none}
.lines{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.lines li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lines small{display:block;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{min-width:34px;min-height:34px;padding:0;border-radius:8px}
.stepper b{min-width:24px;text-align:center}
.empty{color:var(--muted);padding:10px 0;font-size:14px}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.sumrow .big{font:700 24px/1 var(--display)}
.paid{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.paid b{font:700 22px/1 var(--display)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.quick button{min-height:36px;padding:2px;font-size:13px;font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.keypad button{min-height:48px;font-size:18px;font-weight:600;padding:0}
.receipt{background:var(--accent-soft);border-radius:12px;padding:14px;margin-top:10px}
.receipt .no{display:inline-block;font:700 44px/1 var(--display);background:var(--sun);color:var(--sun-fg);padding:8px 16px;border-radius:10px;margin:8px 0}
.receipt p{margin:2px 0;font-size:14px}
.cartbar,.backdrop{display:none}
/* antrean */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.lane h3{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.disiapkan{background:var(--c-makanan)}.dot.siap{background:var(--good)}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.ticket .top{display:flex;justify-content:space-between;align-items:baseline}
.ticket .no{font:700 24px/1 var(--display)}
.ticket p{margin:6px 0 10px;font-size:14px;color:var(--muted)}
.ticket button{width:100%}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tv{position:fixed;inset:0;z-index:50;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:16px;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.tv-top{display:flex;justify-content:space-between;align-items:center}
.tv-top b{font:700 28px var(--display)}
.tv-top button{background:transparent;color:inherit;border-color:rgba(255,255,255,.5)}
.tv-cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.tv-col{border-radius:18px;padding:20px;overflow:auto}
.tv-col.prep{background:rgba(255,255,255,.12)}
.tv-col.ready{background:var(--sun);color:var(--sun-fg)}
.tv-col h2{font-size:22px;margin-bottom:16px}
.tv-nums{display:flex;flex-wrap:wrap;gap:10px 28px;font:700 clamp(40px,9vw,96px)/1 var(--display)}
/* menu */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 120px auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
.mrow .nm{display:flex;flex-direction:column;min-width:0}
.mrow .nm small{color:var(--muted)}
.mrow input[type=text]{padding:8px 10px}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0}
.add{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}
.add label{margin-top:0}
.add button{min-height:44px}
/* laporan */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat span{font-size:13px;color:var(--muted)}
.stat strong{display:block;font:700 26px/1.2 var(--display);margin-top:2px}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stat.hero span{color:inherit;opacity:.85}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.hours{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.hcol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.hcol i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.hcol.zero i{background:var(--line)}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;margin:7px 0;font-size:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent-soft)}
.pill.siap{background:var(--sun);color:var(--sun-fg)}.pill.selesai{background:var(--line);color:var(--muted)}
/* rancangan */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:14px;counter-increment:s}
.steps li::before{content:counter(s);display:block;font:700 20px var(--display);color:var(--accent);margin-bottom:4px}
.erd{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ent{border:2px solid var(--fg);border-radius:12px;overflow:hidden;background:var(--surface)}
.ent h4{margin:0;padding:8px 12px;background:var(--fg);color:var(--bg);font:700 14px var(--display)}
.ent ul{list-style:none;margin:0;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.ent li b{color:var(--accent)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;height:auto;flex-direction:row;padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(10,18,60,.18)}
  .brand,.date{display:none}
  .links{flex-direction:row;margin:0;width:100%;gap:0}
  .links a{flex:1;flex-direction:column;gap:2px;justify-content:center;height:var(--nav-h);padding:6px 2px;border-radius:0;font-size:11px;min-width:0}
  .links a span{white-space:nowrap}
  .content{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 90px) max(16px,env(safe-area-inset-left,0px))}
  .kasir{grid-template-columns:minmax(0,1fr)}
  .cart{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:30;max-height:calc(100dvh - var(--nav-h) - 80px);overflow-y:auto;border-radius:18px 18px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .2s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cart.open{transform:none;visibility:visible}
  .sheet-head button{display:block;min-height:36px}
  .backdrop{position:fixed;inset:0;z-index:25;background:rgba(5,10,40,.5);border:0;border-radius:0;display:none}
  .backdrop.on{display:block}
  .cartbar{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:15;justify-content:space-between;align-items:center;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);min-height:52px;border-radius:14px;font-weight:700;box-shadow:0 6px 18px rgba(10,18,60,.3)}
  .lanes{grid-template-columns:minmax(0,1fr)}
  .mrow{grid-template-columns:minmax(0,1fr) 110px;}
  .add{grid-template-columns:1fr 1fr}.add>div:first-child{grid-column:1/-1}.add button{grid-column:1/-1}
}
@media (max-width:520px){.tv-cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.cart{transition:none}.tile:hover:not(:disabled){transform:none}}
</style>

<script>
var KEY='warung-bu-rina-v2';
var VIEWS=['kasir','antrean','menu','laporan','rancangan'];
var STATUS={menunggu:'Menunggu',disiapkan:'Disiapkan',siap:'Siap diambil',selesai:'Selesai'};
var NEXT={menunggu:'disiapkan',disiapkan:'siap',siap:'selesai'};
var NEXTLABEL={menunggu:'Mulai siapkan',disiapkan:'Tandai siap diambil',siap:'Sudah diambil'};

function $(s){return document.querySelector(s)}
function rp(n){return 'Rp'+new Intl.NumberFormat('id-ID').format(Math.round(n))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function jam(iso){var d=new Date(iso);return pad(d.getHours())+'.'+pad(d.getMinutes())}
function catClass(k){return k==='Makanan'?'makanan':(k==='Minuman'?'minuman':'')}

function seedMenu(){return [
  {id:1,nama:'Nasi Goreng',harga:15000,kategori:'Makanan',tersedia:true},
  {id:2,nama:'Mie Goreng',harga:13000,kategori:'Makanan',tersedia:true},
  {id:3,nama:'Ayam Geprek',harga:17000,kategori:'Makanan',tersedia:true},
  {id:4,nama:'Soto Ayam',harga:14000,kategori:'Makanan',tersedia:true},
  {id:5,nama:'Gorengan',harga:2000,kategori:'Lainnya',tersedia:true},
  {id:6,nama:'Es Teh',harga:4000,kategori:'Minuman',tersedia:true},
  {id:7,nama:'Es Jeruk',harga:5000,kategori:'Minuman',tersedia:true},
  {id:8,nama:'Teh Hangat',harga:3000,kategori:'Minuman',tersedia:true},
  {id:9,nama:'Kerupuk',harga:1000,kategori:'Lainnya',tersedia:true}
]}
function seedOrders(menu){
  var t=today(),now=Date.now();
  function it(id,q){var m=menu.filter(function(x){return x.id===id})[0];return {id:m.id,nama:m.nama,harga:m.harga,qty:q}}
  function mk(n,nama,items,status,ago){
    var total=items.reduce(function(a,i){return a+i.harga*i.qty},0),b=Math.ceil(total/5000)*5000;
    return {id:now-ago*60000,no:'A'+String(n).padStart(3,'0'),tanggal:t,waktu:new Date(now-ago*60000).toISOString(),nama:nama,items:items,total:total,bayar:b,kembali:b-total,status:status,contoh:true}
  }
  return [
    mk(1,'Meja 1',[it(1,1),it(6,1)],'selesai',25),
    mk(2,'Kelas XI RPL',[it(3,2),it(7,2)],'siap',12),
    mk(3,'Pak Dedi',[it(2,1),it(6,1),it(9,1)],'disiapkan',6),
    mk(4,'Kelas X TKJ',[it(4,1),it(8,1)],'menunggu',2)
  ];
}
function fresh(){var m=seedMenu(),s={};s[today()]=4;return {menu:m,orders:seedOrders(m),seq:s,nextId:100}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.menu&&d.orders&&d.seq)return d}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load();

var view='kasir',cart={},filter='Semua',query='',nama='',bayar=0,lastOrder=null,armed=null,sheet=false,tv=false;

function cartItems(){
  return Object.keys(cart).map(function(id){
    var m=S.menu.filter(function(x){return String(x.id)===id})[0];
    return m?{id:m.id,nama:m.nama,harga:m.harga,qty:cart[id]}:null
  }).filter(Boolean)
}
function cartTotal(){return cartItems().reduce(function(a,i){return a+i.harga*i.qty},0)}
function cartCount(){return cartItems().reduce(function(a,i){return a+i.qty},0)}
function todayOrders(){var t=today();return S.orders.filter(function(o){return o.tanggal===t})}

/* ---------- Kasir ---------- */
function renderKasir(){
  var keys=['1','2','3','4','5','6','7','8','9','C','0','000'];
  $('#view').innerHTML='<h1>Kasir</h1><div class="kasir">'+
  '<section class="menu-col"><div class="tools"><label class="sr" for="q" style="position:absolute;left:-9999px">Cari menu</label>'+
  '<input id="q" type="search" placeholder="Cari menu" value="'+esc(query)+'"><div class="chips" id="chips"></div></div>'+
  '<div class="menu-grid" id="menuGrid"></div></section>'+
  '<aside class="card cart'+(sheet?' open':'')+'" id="cart" aria-label="Pesanan">'+
  '<div class="sheet-head"><h2>Pesanan</h2><button data-act="sheet">Tutup</button></div>'+
  '<div id="receipt"></div>'+
  '<label for="nama">Nama atau meja (boleh kosong)</label><input id="nama" type="text" value="'+esc(nama)+'">'+
  '<ul class="lines" id="lines"></ul>'+
  '<div class="sumrow"><span class="muted">Total</span><span class="big num" id="total"></span></div>'+
  '<div class="paid"><span class="muted">Uang dibayar</span><b class="num" id="paid"></b></div>'+
  '<div class="quick"><button data-quick="pas">Pas</button><button data-quick="20000">20rb</button><button data-quick="50000">50rb</button><button data-quick="100000">100rb</button></div>'+
  '<div class="keypad">'+keys.map(function(k){return '<button data-key="'+k+'" aria-label="'+(k==='C'?'Hapus semua':k)+'">'+k+'</button>'}).join('')+'</div>'+
  '<div class="sumrow"><span class="muted" id="kLabel">Kembalian</span><b class="num" id="kembali"></b></div>'+
  '<button class="btn wide" id="payBtn" data-act="pay">Bayar dan beri nomor antrean</button></aside>'+
  '<button class="backdrop'+(sheet?' on':'')+'" data-act="sheet" aria-label="Tutup pesanan" tabindex="-1"></button>'+
  '<button class="cartbar" id="cartbar" data-act="sheet"></button></div>';
  drawChips();drawMenu();drawCart();drawReceipt();
}
function drawChips(){
  var cats=['Semua'].concat(S.menu.map(function(m){return m.kategori}).filter(function(c,i,a){return a.indexOf(c)===i}));
  $('#chips').innerHTML=cats.map(function(c){return '<button data-cat="'+esc(c)+'" aria-pressed="'+(c===filter)+'">'+esc(c)+'</button>'}).join('');
}
function drawMenu(){
  var q=query.trim().toLowerCase();
  var list=S.menu.filter(function(m){return (filter==='Semua'||m.kategori===filter)&&m.nama.toLowerCase().indexOf(q)>-1});
  $('#menuGrid').innerHTML=list.length?list.map(function(m){
    return '<button class="tile '+catClass(m.kategori)+'" data-add="'+m.id+'"'+(m.tersedia?'':' disabled')+'><b>'+esc(m.nama)+'</b><span class="num">'+rp(m.harga)+'</span>'+(m.tersedia?'':'<small>Habis</small>')+'</button>'
  }).join(''):'<div class="empty">Menu tidak ditemukan.</div>';
}
function drawCart(){
  var items=cartItems(),total=cartTotal(),n=cartCount();
  $('#lines').innerHTML=items.length?items.map(function(i){
    return '<li><span>'+esc(i.nama)+'<small class="num">'+rp(i.harga)+' × '+i.qty+' = '+rp(i.harga*i.qty)+'</small></span>'+
    '<span class="stepper"><button data-dec="'+i.id+'" aria-label="Kurangi '+esc(i.nama)+'">−</button><b class="num">'+i.qty+'</b><button data-inc="'+i.id+'" aria-label="Tambah '+esc(i.nama)+'">+</button></span></li>'
  }).join(''):'<li class="empty">Ketuk menu untuk menambah pesanan.</li>';
  $('#total').textContent=rp(total);
  $('#paid').textContent=rp(bayar);
  var kurang=total&&bayar<total;
  $('#kLabel').textContent=kurang?'Kurang':'Kembalian';
  $('#kembali').textContent=!total?'Rp0':(kurang?rp(total-bayar):rp(bayar-total));
  $('#payBtn').disabled=!total||bayar<total;
  $('#cartbar').innerHTML=n?'<span>'+n+' item · '+rp(total)+'</span><span>Lihat pesanan</span>':(lastOrder?'<span>Pesanan terakhir '+lastOrder.no+'</span><span>Lihat struk</span>':'<span>Belum ada pesanan</span><span>Buka</span>');
}
function drawReceipt(){
  var o=lastOrder,el=$('#receipt');
  if(!o){el.innerHTML='';return}
  el.innerHTML='<div class="receipt"><p><b>Pesanan masuk. Nomor antrean:</b></p><div class="no">'+o.no+'</div>'+
  (o.nama?'<p>Atas nama '+esc(o.nama)+'</p>':'')+
  o.items.map(function(i){return '<p class="num">'+i.qty+' × '+esc(i.nama)+' · '+rp(i.harga*i.qty)+'</p>'}).join('')+
  '<p class="num"><b>Total '+rp(o.total)+'</b> · Bayar '+rp(o.bayar)+' · Kembali '+rp(o.kembali)+'</p>'+
  '<button data-act="closeReceipt" style="margin-top:8px">Tutup struk</button></div>';
}
function pay(){
  var items=cartItems(),total=cartTotal();
  if(!items.length||bayar<total)return;
  var t=today();S.seq[t]=(S.seq[t]||0)+1;
  var o={id:Date.now(),no:'A'+String(S.seq[t]).padStart(3,'0'),tanggal:t,waktu:new Date().toISOString(),nama:nama.trim(),items:items,total:total,bayar:bayar,kembali:bayar-total,status:'menunggu'};
  S.orders.push(o);save();
  lastOrder=o;cart={};bayar=0;nama='';
  $('#nama').value='';
  drawCart();drawReceipt();
}
function keypress(k){
  if(k==='C')bayar=0;
  else if(k==='000')bayar=Math.min(bayar*1000,99999999);
  else bayar=Math.min(bayar*10+parseInt(k,10),99999999);
  drawCart();
}

/* ---------- Antrean ---------- */
function sampleNote(){
  return S.orders.some(function(o){return o.contoh})?'<div class="note"><span>Pesanan A001–A004 adalah data contoh agar halaman tidak kosong.</span><button data-act="clearSample">Hapus data contoh</button></div>':'';
}
function renderAntrean(){
  var list=todayOrders().filter(function(o){return o.status!=='selesai'});
  function nums(st){var r=list.filter(function(o){return st.indexOf(o.status)>-1});return r.length?r.map(function(o){return '<span class="num">'+o.no+'</span>'}).join(''):'<span style="font-size:24px;opacity:.6;font-weight:500">Belum ada</span>'}
  function lane(st){
    var r=list.filter(function(o){return o.status===st});
    return '<div class="lane"><h3><i class="dot '+st+'"></i>'+STATUS[st]+' · '+r.length+'</h3>'+(r.length?r.map(function(o){
      return '<div class="ticket"><div class="top"><span class="no">'+o.no+'</span><span class="num muted" style="font-size:13px">'+jam(o.waktu)+'</span></div>'+
      '<p>'+(o.nama?esc(o.nama)+' · ':'')+o.items.map(function(i){return i.qty+' '+esc(i.nama)}).join(', ')+'</p>'+
      '<button data-adv="'+o.id+'">'+NEXTLABEL[o.status]+'</button></div>'
    }).join(''):'<div class="empty">Kosong</div>')+'</div>';
  }
  $('#view').innerHTML='<div class="head-row"><h1>Antrean</h1><button class="btn" data-act="tv">Buka layar TV</button></div>'+sampleNote()+
  '<div class="lanes">'+lane('menunggu')+lane('disiapkan')+lane('siap')+'</div>'+
  (tv?'<div class="tv" role="dialog" aria-label="Layar antrean"><div class="tv-top"><b>Warung Bu Rina</b><button data-act="tv">Tutup layar</button></div>'+
  '<div class="tv-cols"><div class="tv-col prep"><h2>Sedang disiapkan</h2><div class="tv-nums">'+nums(['menunggu','disiapkan'])+'</div></div>'+
  '<div class="tv-col ready"><h2>Silakan ambil</h2><div class="tv-nums">'+nums(['siap'])+'</div></div></div></div>':'');
}

/* ---------- Menu ---------- */
function renderMenu(){
  $('#view').innerHTML='<h1>Menu</h1><section class="card"><h2 style="margin-bottom:10px">Tambah menu</h2><form id="addForm" class="add">'+
  '<div><label for="mNama">Nama</label><input id="mNama" type="text" required></div>'+
  '<div><label for="mHarga">Harga (Rp)</label><input id="mHarga" inputmode="numeric" required></div>'+
  '<div><label for="mKat">Kategori</label><select id="mKat"><option>Makanan</option><option>Minuman</option><option>Lainnya</option></select></div>'+
  '<button class="btn" type="submit">Tambah</button></form></section>'+
  '<section class="card"><h2>Daftar menu</h2><p class="muted" style="margin:2px 0 6px;font-size:14px">Harga adalah contoh. Ubah sesuai harga warung.</p>'+
  S.menu.map(function(m){
    var k='del-'+m.id;
    return '<div class="mrow"><div class="nm"><b>'+esc(m.nama)+'</b><small>'+esc(m.kategori)+'</small></div>'+
    '<input type="text" class="num" inputmode="numeric" data-price="'+m.id+'" value="'+m.harga+'" aria-label="Harga '+esc(m.nama)+'">'+
    '<label class="sw"><input type="checkbox" data-avail="'+m.id+'"'+(m.tersedia?' checked':'')+'> Tersedia</label>'+
    '<button class="danger" data-arm="'+k+'" data-del="'+m.id+'">'+(armed===k?'Yakin hapus?':'Hapus')+'</button></div>'
  }).join('')+'</section>';
}

/* ---------- Laporan ---------- */
function renderLaporan(){
  var os=todayOrders(),omzet=os.reduce(function(a,o){return a+o.total},0),cnt={},byH={};
  os.forEach(function(o){
    o.items.forEach(function(i){cnt[i.nama]=(cnt[i.nama]||0)+i.qty});
    var h=new Date(o.waktu).getHours();byH[h]=(byH[h]||0)+o.total;
  });
  var hs=Object.keys(byH).map(Number),lo=Math.min.apply(null,hs.concat([8])),hi=Math.max.apply(null,hs.concat([13])),hmax=Math.max.apply(null,Object.keys(byH).map(function(k){return byH[k]}).concat([1])),cols='';
  for(var h=lo;h<=hi;h++){
    var v=byH[h]||0;
    cols+='<div class="hcol'+(v?'':' zero')+'">'+(v?'<span class="num">'+Math.round(v/1000)+'rb</span>':'')+'<i style="height:'+Math.max(2,Math.round(v/hmax*100))+'px"></i><span class="num">'+pad(h)+'</span></div>';
  }
  var top=Object.keys(cnt).map(function(k){return [k,cnt[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,5);
  $('#view').innerHTML='<h1>Laporan hari ini</h1>'+sampleNote()+
  '<div class="stats"><div class="card stat hero"><span>Pendapatan</span><strong class="num">'+rp(omzet)+'</strong></div>'+
  '<div class="card stat"><span>Transaksi</span><strong class="num">'+os.length+'</strong></div>'+
  '<div class="card stat"><span>Rata-rata per transaksi</span><strong class="num">'+rp(os.length?omzet/os.length:0)+'</strong></div></div>'+
  '<div class="two"><section class="card"><h3>Pendapatan per jam (ribu rupiah)</h3><div class="hours">'+cols+'</div></section>'+
  '<section class="card"><h3>Menu terlaris</h3>'+(top.length?top.map(function(t,i){return '<div class="trow"><span>'+(i+1)+'. '+esc(t[0])+'</span><b class="num">'+t[1]+' porsi</b></div>'}).join(''):'<div class="empty">Belum ada penjualan.</div>')+'</section></div>'+
  '<section class="card"><h3>Transaksi</h3><div class="tbl"><table><thead><tr><th>No</th><th>Jam</th><th>Nama</th><th>Pesanan</th><th class="r">Total</th><th>Status</th></tr></thead><tbody>'+
  (os.length?os.slice().reverse().map(function(o){
    return '<tr><td><b>'+o.no+'</b></td><td class="num">'+jam(o.waktu)+'</td><td>'+esc(o.nama||'-')+'</td><td>'+o.items.map(function(i){return i.qty+' '+esc(i.nama)}).join(', ')+'</td><td class="r num">'+rp(o.total)+'</td><td><span class="pill '+o.status+'">'+STATUS[o.status]+'</span></td></tr>'
  }).join(''):'<tr><td colspan="6" class="muted">Belum ada transaksi.</td></tr>')+'</tbody></table></div></section>'+
  '<section class="card"><h3>Pengaturan data</h3><p class="muted" style="margin:0 0 10px;font-size:14px">Data tersimpan di browser ini saja.</p>'+
  '<button class="danger" data-arm="reset-orders" data-act="resetOrders">'+(armed==='reset-orders'?'Yakin kosongkan transaksi?':'Kosongkan semua transaksi')+'</button> '+
  '<button class="danger" data-arm="reset-menu" data-act="resetMenu">'+(armed==='reset-menu'?'Yakin kembalikan menu contoh?':'Kembalikan menu contoh')+'</button></section>';
}

/* ---------- Rancangan ---------- */
function renderRancangan(){
  $('#view').innerHTML='<h1>Rancangan</h1>'+
  '<section class="card"><h3>Alur kerja</h3><ol class="steps"><li>Pelanggan memesan di kasir</li><li>Kasir memilih menu</li><li>Masukkan uang bayar, sistem hitung kembalian</li><li>Nomor antrean keluar (A001, A002, …)</li><li>Dapur menyiapkan pesanan</li><li>Nomor tampil di “Silakan ambil”</li><li>Pesanan diambil, selesai</li></ol>'+
  '<p class="muted" style="margin:12px 0 0;font-size:14px">Nomor antrean mulai lagi dari A001 setiap hari. Status: menunggu, disiapkan, siap diambil, selesai.</p></section>'+
  '<section class="card"><h3>Struktur database</h3><div class="erd">'+
  '<div class="ent"><h4>menu</h4><ul><li><b>PK</b> id_menu</li><li>nama</li><li>harga</li><li>kategori</li><li>tersedia</li></ul></div>'+
  '<div class="ent"><h4>pesanan</h4><ul><li><b>PK</b> id_pesanan</li><li>no_antrean</li><li>tanggal</li><li>nama_pelanggan</li><li>total, bayar, kembali</li><li>status</li></ul></div>'+
  '<div class="ent"><h4>detail_pesanan</h4><ul><li><b>PK</b> id_detail</li><li><b>FK</b> id_pesanan</li><li><b>FK</b> id_menu</li><li>jumlah</li><li>harga_satuan</li></ul></div></div>'+
  '<p class="muted" style="margin:12px 0 0;font-size:14px">Satu pesanan punya banyak detail, satu menu muncul di banyak detail. <code>harga_satuan</code> disalin agar laporan lama tidak berubah saat harga menu diganti.</p></section>'+
  '<section class="card"><h3>Pengembangan lanjut</h3><p style="margin:0;font-size:14px">Prototipe ini menyimpan data di browser. Agar kasir dan layar TV di perangkat berbeda saling terhubung, pindahkan penyimpanan ke server dengan tiga tabel di atas (misalnya PHP dan MySQL).</p></section>';
}

/* ---------- router dan event ---------- */
function render(){
  var tabs=document.querySelectorAll('.links a');
  for(var i=0;i<tabs.length;i++){if(tabs[i].getAttribute('href')==='#'+view)tabs[i].setAttribute('aria-current','page');else tabs[i].removeAttribute('aria-current')}
  ({kasir:renderKasir,antrean:renderAntrean,menu:renderMenu,laporan:renderLaporan,rancangan:renderRancangan})[view]();
}
function route(){var v=location.hash.slice(1);view=VIEWS.indexOf(v)>-1?v:'kasir';armed=null;sheet=false;tv=false;render()}
window.addEventListener('hashchange',route);
window.addEventListener('storage',function(e){if(e.key===KEY&&(view==='antrean'||view==='laporan')){S=load();render()}});

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset,rerender=false;
  if(armed&&armed!==d.arm){armed=null;rerender=true}
  if(d.cat!==undefined){filter=d.cat;drawChips();drawMenu();rerender=false}
  else if(d.add){cart[d.add]=(cart[d.add]||0)+1;drawCart()}
  else if(d.inc){cart[d.inc]=(cart[d.inc]||0)+1;drawCart()}
  else if(d.dec){cart[d.dec]=(cart[d.dec]||0)-1;if(cart[d.dec]<=0)delete cart[d.dec];drawCart()}
  else if(d.quick){bayar=d.quick==='pas'?cartTotal():parseInt(d.quick,10);drawCart()}
  else if(d.key){keypress(d.key)}
  else if(d.act==='sheet'){sheet=!sheet;$('#cart').classList.toggle('open',sheet);document.querySelector('.backdrop').classList.toggle('on',sheet)}
  else if(d.act==='pay'){pay()}
  else if(d.act==='closeReceipt'){lastOrder=null;drawReceipt();drawCart()}
  else if(d.act==='tv'){tv=!tv;render();rerender=false}
  else if(d.adv){
    var o=S.orders.filter(function(x){return String(x.id)===d.adv})[0];
    if(o&&NEXT[o.status]){o.status=NEXT[o.status];save();render();rerender=false}
  }
  else if(d.act==='clearSample'){
    S.orders=S.orders.filter(function(o){return !o.contoh});
    S.seq[today()]=S.orders.filter(function(o){return o.tanggal===today()}).length;save();render();rerender=false
  }
  else if(d.del){
    if(armed==='del-'+d.del){S.menu=S.menu.filter(function(m){return String(m.id)!==d.del});armed=null;save()}
    else armed='del-'+d.del;
    render();rerender=false
  }
  else if(d.act==='resetOrders'){
    if(armed==='reset-orders'){S.orders=[];S.seq={};armed=null;save()}else armed='reset-orders';
    render();rerender=false
  }
  else if(d.act==='resetMenu'){
    if(armed==='reset-menu'){S.menu=seedMenu();cart={};armed=null;save()}else armed='reset-menu';
    render();rerender=false
  }
  if(rerender)render();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){query=t.value;drawMenu()}
  else if(t.id==='nama'){nama=t.value}
});
document.addEventListener('change',function(e){
  var t=e.target,m;
  if(t.dataset.price){m=S.menu.filter(function(x){return String(x.id)===t.dataset.price})[0];var v=parseInt(t.value.replace(/\D/g,''),10);if(m&&v>=0){m.harga=v;save()}t.value=m?m.harga:t.value}
  else if(t.dataset.avail){m=S.menu.filter(function(x){return String(x.id)===t.dataset.avail})[0];if(m){m.tersedia=t.checked;save()}}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='addForm')return;
  e.preventDefault();
  var n=$('#mNama').value.trim(),h=parseInt($('#mHarga').value.replace(/\D/g,''),10);
  if(!n||!(h>=0))return;
  S.menu.push({id:S.nextId++,nama:n,harga:h,kategori:$('#mKat').value,tersedia:true});save();render();
});

$('#date').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
route();
</script>

</body></html>
